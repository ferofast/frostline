<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FROSTLINE — freeze is the only wall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1626; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #test { position: absolute; left: 0; top: 0; color: #fff; font: 12px monospace; white-space: pre; }
</style>
</head>
<body>
<canvas id="game" aria-label="FROSTLINE: click a river segment to freeze it and shatter the ember enemies marching in the water"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="test"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
